name: Release

on:
  push:
    tags:
      - "v*"

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  KIND_VERSION: v0.32.0
  RELEASE_PREVIOUS_VERSION: 0.4.0-alpha.1

jobs:
  validate:
    name: Validate release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Validate tag and release metadata
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ ! "${VERSION}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?(\+[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} is not a supported semantic version" >&2
            exit 1
          fi

          CHART_VERSION="$(awk '$1 == "version:" {gsub(/"/, "", $2); print $2}' charts/noctaya/Chart.yaml)"
          APP_VERSION="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' charts/noctaya/Chart.yaml)"
          if [[ "${CHART_VERSION}" != "${VERSION}" || "${APP_VERSION}" != "${VERSION}" ]]; then
            echo "Tag ${VERSION}, chart ${CHART_VERSION}, and app ${APP_VERSION} must match" >&2
            exit 1
          fi

          grep -Fq "## [${VERSION}]" CHANGELOG.md
          git merge-base --is-ancestor "${GITHUB_SHA}" "origin/main"
          helm lint charts/noctaya
          helm template noctaya charts/noctaya --namespace noctaya-system >/dev/null

  release-validation:
    name: Validate upgrade and recovery
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Install Kind
        run: |
          ARCH="$(go env GOARCH)"
          URL="https://kind.sigs.k8s.io/dl/${KIND_VERSION}/kind-linux-${ARCH}"
          curl --fail --show-error --location --output kind "${URL}"
          curl --fail --show-error --location --output kind.sha256sum "${URL}.sha256sum"
          echo "$(cut -d ' ' -f 1 kind.sha256sum)  kind" | sha256sum --check -
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Run release validation
        run: make test-release

      - name: Upload release-validation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-validation-${{ github.ref_name }}
          path: bin/release-validation
          if-no-files-found: error
          retention-days: 30

  images:
    name: Publish container images
    needs: [validate, release-validation]
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Log in to GHCR
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve version
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          {
            echo "version=${VERSION}"
            echo "operator_tags<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/noctaya:${VERSION}"
            if [[ "${VERSION}" != *-* ]]; then
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/noctaya:latest"
            fi
            echo "EOF"
            echo "gateway_tags<<EOF"
            echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/noctaya-gateway:${VERSION}"
            if [[ "${VERSION}" != *-* ]]; then
              echo "ghcr.io/${GITHUB_REPOSITORY_OWNER}/noctaya-gateway:latest"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push operator image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.v.outputs.operator_tags }}
          cache-from: type=gha,scope=noctaya-operator
          cache-to: type=gha,mode=max,scope=noctaya-operator
          provenance: mode=max
          sbom: true

      - name: Build and push gateway image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: Dockerfile.gateway
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: ${{ steps.v.outputs.gateway_tags }}
          cache-from: type=gha,scope=noctaya-gateway
          cache-to: type=gha,mode=max,scope=noctaya-gateway
          provenance: mode=max
          sbom: true

  chart:
    name: Publish Helm chart
    needs: [validate, images]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Package chart at the release version
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          helm package charts/noctaya --version "$VERSION" --app-version "$VERSION"

      - name: Build release notes (curated highlights + contributor thanks)
        run: |
          bash hack/extract-changelog.sh "${GITHUB_REF_NAME}" > release-body.md
          if [ ! -s release-body.md ]; then
            echo "CHANGELOG.md has no content for ${GITHUB_REF_NAME}" >&2
            exit 1
          fi
          {
            echo
            echo "---"
            echo
            echo "🙏 **Thanks to everyone who contributed to this release** — the merged PRs and first-time"
            echo "contributors are credited under **What's Changed** and **New Contributors** below."
          } >> release-body.md

      - name: Generate chart checksum
        run: sha256sum noctaya-*.tgz > checksums.txt

      - name: Attach chart to the GitHub release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body_path: release-body.md
          fail_on_unmatched_files: true
          files: |
            noctaya-*.tgz
            checksums.txt
