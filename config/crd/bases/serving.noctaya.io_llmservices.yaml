---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  name: llmservices.serving.noctaya.io
spec:
  group: serving.noctaya.io
  names:
    kind: LLMService
    listKind: LLMServiceList
    plural: llmservices
    singular: llmservice
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.resolvedRuntime
      name: Runtime
      type: string
    - jsonPath: .status.replicas
      name: Replicas
      type: integer
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: LLMService declaratively serves one model behind a scale-to-zero
          gateway.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: LLMServiceSpec describes a model, runtime, resources, scaling,
              caching, and endpoint.
            properties:
              cache:
                default: {}
                description: cache configures model-weight storage and prewarming.
                properties:
                  prewarm:
                    description: prewarm requests a one-time Job that hydrates weights
                      into the cache.
                    type: boolean
                  size:
                    anyOf:
                    - type: integer
                    - type: string
                    description: size is the requested NodeLocalPVC capacity.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  storageClassName:
                    description: |-
                      storageClassName pins the cache PVC to a StorageClass; empty uses the cluster
                      default. Set this on clusters without a default StorageClass (common on managed
                      or domestic clusters) or to target a specific disk type.
                    type: string
                  strategy:
                    default: NodeLocalPVC
                    description: strategy selects the model cache backend.
                    enum:
                    - NodeLocalPVC
                    - HostPath
                    - SharedPVC
                    - BakedImage
                    - None
                    type: string
                type: object
              endpoint:
                default: {}
                description: endpoint configures client-facing cold-start behavior.
                properties:
                  authentication:
                    description: authentication enables client-facing Bearer authentication.
                    properties:
                      secretRef:
                        description: secretRef identifies the Secret key containing
                          the accepted Bearer token.
                        properties:
                          key:
                            description: key is the data key containing the API key.
                            minLength: 1
                            type: string
                          name:
                            description: name is the Secret name.
                            minLength: 1
                            type: string
                        required:
                        - key
                        - name
                        type: object
                    required:
                    - secretRef
                    type: object
                  coldStart:
                    default: {}
                    description: coldStart configures requests received while the
                      backend is unavailable.
                    properties:
                      heartbeatInterval:
                        default: 10s
                        description: heartbeatInterval controls SSE keepalive comments
                          while activation waits.
                        type: string
                      mode:
                        default: keepalive
                        description: |-
                          mode is how cold requests are handled: keepalive (SSE heartbeats hold the
                          connection) or reject (fast 503 + Retry-After for the client to retry).
                        enum:
                        - keepalive
                        - reject
                        type: string
                    type: object
                    x-kubernetes-validations:
                    - message: heartbeatInterval must be greater than zero
                      rule: '!has(self.heartbeatInterval) || duration(self.heartbeatInterval)
                        > duration(''0s'')'
                  maxQueue:
                    default: 100
                    description: maxQueue bounds requests admitted by each gateway
                      replica.
                    format: int32
                    minimum: 1
                    type: integer
                  openAICompatible:
                    default: true
                    description: |-
                      openAICompatible is informational in v0: the gateway always serves the
                      OpenAI-compatible API. Reserved for future protocol selection.
                    type: boolean
                  resources:
                    description: resources configures CPU and memory for each gateway
                      replica.
                    properties:
                      limits:
                        description: limits caps CPU and memory for each gateway replica.
                        properties:
                          cpu:
                            anyOf:
                            - type: integer
                            - type: string
                            description: cpu is a Kubernetes CPU quantity.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          memory:
                            anyOf:
                            - type: integer
                            - type: string
                            description: memory is a Kubernetes memory quantity.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                        type: object
                      requests:
                        description: requests reserves CPU and memory for each gateway
                          replica.
                        properties:
                          cpu:
                            anyOf:
                            - type: integer
                            - type: string
                            description: cpu is a Kubernetes CPU quantity.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                          memory:
                            anyOf:
                            - type: integer
                            - type: string
                            description: memory is a Kubernetes memory quantity.
                            pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                            x-kubernetes-int-or-string: true
                        type: object
                    type: object
                type: object
              imagePullSecrets:
                description: |-
                  imagePullSecrets are applied to the backend, gateway, and prewarm pods so images
                  from private/air-gapped registries can be pulled. The secrets must exist in the
                  LLMService's namespace.
                items:
                  description: |-
                    LocalObjectReference contains enough information to let you locate the
                    referenced object inside the same namespace.
                  properties:
                    name:
                      default: ""
                      description: |-
                        Name of the referent.
                        This field is effectively required, but due to backwards compatibility is
                        allowed to be empty. Instances of this type with an empty value here are
                        almost certainly wrong.
                        More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                      type: string
                  type: object
                  x-kubernetes-map-type: atomic
                type: array
              model:
                description: model identifies the weights served by the backend.
                properties:
                  catalogRef:
                    description: |-
                      catalogRef points to an external model catalog entry. Catalog resolution
                      is currently not implemented in v0; use model.source.uri for now.
                    type: string
                  source:
                    description: source is the inline model location used in v0.
                    properties:
                      secretRef:
                        description: |-
                          secretRef holds credentials for private sources (e.g. a ModelScope token).
                          Not supported in v0: setting it fails reconcile until private sources land.
                        properties:
                          name:
                            default: ""
                            description: |-
                              Name of the referent.
                              This field is effectively required, but due to backwards compatibility is
                              allowed to be empty. Instances of this type with an empty value here are
                              almost certainly wrong.
                              More info: https://kubernetes.io/docs/concepts/overview/working-with-objects/names/#names
                            type: string
                        type: object
                        x-kubernetes-map-type: atomic
                      uri:
                        description: |-
                          uri is the model location. Supported in v0: hf://, modelscope://, and
                          pvc://<claim>[/<subpath>] (pre-staged weights on an existing PVC, mounted
                          read-only). oci:// and s3:// are not yet implemented.
                        minLength: 1
                        type: string
                    required:
                    - uri
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of source or catalogRef
                  rule: has(self.source) != (has(self.catalogRef) && size(self.catalogRef)
                    > 0)
              resources:
                default: {}
                description: resources requests accelerators and compute for each
                  backend replica.
                properties:
                  accelerators:
                    default: 1
                    description: accelerators is the number of whole devices requested
                      per backend replica.
                    format: int32
                    minimum: 1
                    type: integer
                  cpu:
                    anyOf:
                    - type: integer
                    - type: string
                    description: cpu is the CPU request for each backend replica.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                  fraction:
                    description: |-
                      fraction requests a sub-device slice; valid only when the runtime supports sharing.
                      Not supported in v0 (no runtime supports sharing yet): setting it fails reconcile.
                    properties:
                      cores:
                        description: cores requests a device-compute share.
                        format: int32
                        type: integer
                      memory:
                        anyOf:
                        - type: integer
                        - type: string
                        description: memory requests a device-memory slice.
                        pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                        x-kubernetes-int-or-string: true
                    type: object
                  memory:
                    anyOf:
                    - type: integer
                    - type: string
                    description: memory is the memory request and limit for each backend
                      replica.
                    pattern: ^(\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))(([KMGTPE]i)|[numkMGTPE]|([eE](\+|-)?(([0-9]+(\.[0-9]*)?)|(\.[0-9]+))))?$
                    x-kubernetes-int-or-string: true
                type: object
              runtime:
                description: runtime selects the backend — pinned by name or auto-picked
                  by vendor preference.
                properties:
                  argsOverride:
                    description: |-
                      argsOverride is appended after the runtime's serving args. Duplicate flags may
                      override earlier values when supported by the runtime CLI.
                    items:
                      type: string
                    type: array
                  name:
                    description: name pins one cluster-scoped InferenceRuntime.
                    type: string
                  selector:
                    description: selector auto-picks among runtimes by vendor preference
                      order.
                    properties:
                      vendor:
                        description: vendor lists acceptable vendors in preference
                          order.
                        items:
                          enum:
                          - nvidia
                          - ascend
                          type: string
                        minItems: 1
                        type: array
                    type: object
                type: object
                x-kubernetes-validations:
                - message: set exactly one of name or selector.vendor
                  rule: (has(self.name) && size(self.name) > 0) != (has(self.selector)
                    && has(self.selector.vendor) && size(self.selector.vendor) > 0)
              scaling:
                default: {}
                description: scaling configures KEDA and cold-start timing.
                properties:
                  activationTimeout:
                    default: 5m
                    description: activationTimeout is how long the gateway buffers
                      a request during cold start.
                    type: string
                  drainTimeout:
                    default: 2m
                    description: |-
                      drainTimeout is the pre-stop wait for in-flight requests. Noctaya widens the
                      pod termination grace period when this timeout needs more room.
                    type: string
                  externalScaler:
                    description: externalScaler configures transport security for
                      KEDA's External Push connection.
                    properties:
                      tls:
                        description: tls enables mutual TLS between KEDA and the ExternalScaler.
                        properties:
                          authenticationRef:
                            description: |-
                              authenticationRef selects the KEDA authentication object that provides
                              caCert, tlsClientCert, and tlsClientKey.
                            properties:
                              kind:
                                default: TriggerAuthentication
                                description: kind selects a namespaced or cluster-scoped
                                  KEDA authentication object.
                                enum:
                                - TriggerAuthentication
                                - ClusterTriggerAuthentication
                                type: string
                              name:
                                description: name is the TriggerAuthentication or
                                  ClusterTriggerAuthentication name.
                                minLength: 1
                                type: string
                            required:
                            - name
                            type: object
                          serverSecretName:
                            description: |-
                              serverSecretName is a Secret in the LLMService namespace containing tls.crt,
                              tls.key, and ca.crt. The CA must verify KEDA's client certificate.
                            minLength: 1
                            type: string
                        required:
                        - authenticationRef
                        - serverSecretName
                        type: object
                    type: object
                  max:
                    default: 1
                    description: max is the maximum number of backend replicas.
                    format: int32
                    minimum: 1
                    type: integer
                  metric:
                    default: queueDepth
                    description: |-
                      metric selects the scaling signal. Only queueDepth is wired to the autoscaler
                      in v0; kvCacheUtil is reserved and fails reconcile if selected.
                    enum:
                    - queueDepth
                    - kvCacheUtil
                    type: string
                  min:
                    default: 0
                    description: min replicas; 0 enables scale-to-zero.
                    format: int32
                    minimum: 0
                    type: integer
                  scaleDownStabilization:
                    default: 5m
                    description: |-
                      scaleDownStabilization delays HPA scale-down and the final transition to zero.
                      Values must use whole seconds and cannot exceed the HPA limit of one hour.
                    type: string
                  target:
                    default: 10
                    description: target is the desired metric value per replica.
                    format: int32
                    minimum: 1
                    type: integer
                type: object
                x-kubernetes-validations:
                - message: min must not exceed max
                  rule: '!has(self.min) || !has(self.max) || self.min <= self.max'
                - message: activationTimeout must be greater than zero
                  rule: '!has(self.activationTimeout) || duration(self.activationTimeout)
                    > duration(''0s'')'
                - message: drainTimeout must not be negative
                  rule: '!has(self.drainTimeout) || duration(self.drainTimeout) >=
                    duration(''0s'')'
            required:
            - model
            - runtime
            type: object
          status:
            description: LLMServiceStatus defines the observed state of LLMService.
            properties:
              conditions:
                description: conditions describe the service's observed state.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              endpointURL:
                description: endpointURL is the OpenAI-compatible base URL clients
                  should call.
                type: string
              phase:
                description: phase summarizes backend availability.
                enum:
                - Pending
                - Loading
                - Ready
                - ScaledToZero
                - Degraded
                type: string
              replicas:
                description: replicas is the number of ready backend replicas.
                format: int32
                type: integer
              resolvedRuntime:
                description: resolvedRuntime is the InferenceRuntime actually selected.
                type: string
            type: object
        required:
        - spec
        type: object
    served: true
    storage: true
    subresources:
      status: {}
