apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: noctaya
    app.kubernetes.io/managed-by: kustomize
  name: inferenceruntime-admin-role
rules:
- apiGroups:
  - serving.noctaya.io
  resources:
  - inferenceruntimes
  verbs:
  - '*'
- apiGroups:
  - serving.noctaya.io
  resources:
  - inferenceruntimes/status
  verbs:
  - get
