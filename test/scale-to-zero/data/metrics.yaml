apiVersion: v1
kind: ServiceAccount
metadata:
  name: metrics-reader
  namespace: noctaya-e2e
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: noctaya-e2e-metrics-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: noctaya-metrics-reader
subjects:
  - kind: ServiceAccount
    name: metrics-reader
    namespace: noctaya-e2e
---
apiVersion: v1
kind: Pod
metadata:
  name: metrics-reader
  namespace: noctaya-e2e
spec:
  restartPolicy: Never
  serviceAccountName: metrics-reader
  containers:
    - name: reader
      image: noctaya.io/vllm-stub:e2e
      command:
        - /bin/sh
        - -ec
      args:
        - |
          token="$(cat /var/run/secrets/kubernetes.io/serviceaccount/token)"
          for attempt in $(seq 1 30); do
            if wget --quiet --output-document=- --no-check-certificate \
              --header="Authorization: Bearer ${token}" \
              https://noctaya-controller-manager-metrics-service.noctaya-system.svc:8443/metrics; then
              exit 0
            fi
            sleep 2
          done
          exit 1
      securityContext:
        allowPrivilegeEscalation: false
        capabilities:
          drop:
            - ALL
        readOnlyRootFilesystem: true
        runAsNonRoot: true
        runAsUser: 65532
        seccompProfile:
          type: RuntimeDefault
