apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../base

patches:
  - target:
      kind: Deployment
      labelSelector: control-plane=controller-manager
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/args/5
        value: --scaler-mode=external-push
