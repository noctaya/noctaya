apiVersion: serving.noctaya.io/v1alpha1
kind: InferenceRuntime
metadata:
  name: vllm-stub-unsched
spec:
  family: vllm
  vendor: nvidia
  priority: 100
  container:
    image: noctaya.io/vllm-stub:e2e
    args: ["--model={{ .Model.Path }}"]
    port:
      name: http
      containerPort: 8000
  accelerator:
    # A resource the node does not advertise → the backend pod never schedules,
    # so the gateway stays cold and (in reject mode) fast-503s.
    resourceName: noctaya.io/missing-gpu
    sharing:
      supported: false
  health:
    readiness:
      httpGet: { path: /health, port: http }
---
apiVersion: serving.noctaya.io/v1alpha1
kind: LLMService
metadata:
  name: stub-503
  namespace: noctaya-e2e
spec:
  model:
    source:
      uri: hf://noctaya/stub-model
  runtime:
    name: vllm-stub-unsched
  resources:
    accelerators: 1
    cpu: "100m"
    memory: 128Mi
  scaling:
    min: 0
    max: 1
    metric: queueDepth
    target: 1
    activationTimeout: 5s
  endpoint:
    openAICompatible: true
    coldStart:
      mode: reject
