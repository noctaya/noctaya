apiVersion: serving.noctaya.io/v1alpha1
kind: LLMService
metadata:
  name: release-svc
  namespace: noctaya-release
spec:
  model:
    source:
      uri: hf://noctaya/release-stub
  runtime:
    name: release-vllm-stub
  resources:
    accelerators: 1
    cpu: "100m"
    memory: 128Mi
  scaling:
    min: 0
    max: 1
    metric: queueDepth
    target: 1
    activationTimeout: 2m
    scaleDownStabilization: 5s
    drainTimeout: 10s
  cache:
    strategy: None
  endpoint:
    openAICompatible: true
    coldStart:
      mode: keepalive
      heartbeatInterval: 2s
