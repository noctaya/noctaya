apiVersion: serving.noctaya.io/v1alpha1
kind: LLMService
metadata:
  labels:
    app.kubernetes.io/name: noctaya
    app.kubernetes.io/managed-by: kustomize
  name: qwen3-8b-a100
spec:
  model:
    source:
      uri: modelscope://Qwen/Qwen3-8B-Instruct
  runtime:
    name: vllm-nvidia-a100
    argsOverride:
      - --max-model-len=8192
      - --gpu-memory-utilization=0.9
  resources:
    accelerators: 1
    cpu: "8"
    memory: 32Gi
  scaling:
    min: 0
    # Raise this only when the cluster advertises additional free A100 GPUs.
    max: 1
    metric: queueDepth
    target: 10
    activationTimeout: 5m
  cache:
    strategy: NodeLocalPVC
    size: 60Gi
    # Optional: set this for your cluster if you do not want to use the default StorageClass.
    # storageClassName: <your-rwo-storage-class> # e.g. alicloud-disk-essd
    prewarm: true
  endpoint:
    openAICompatible: true
    coldStart:
      mode: keepalive
      heartbeatInterval: 10s
