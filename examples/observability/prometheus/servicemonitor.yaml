apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  labels:
    app.kubernetes.io/name: noctaya
    app.kubernetes.io/component: observability
    app.kubernetes.io/managed-by: kustomize
  name: noctaya-llmservices
# namespaceSelector is intentionally omitted: install this object in each
# LLMService namespace so discovery stays namespace-scoped.
spec:
  endpoints:
    - interval: 15s
      path: /metrics
      port: http
      relabelings:
        - sourceLabels:
            - __meta_kubernetes_service_label_serving_noctaya_io_llmservice
          targetLabel: llmservice
  selector:
    matchLabels:
      app.kubernetes.io/managed-by: noctaya
    matchExpressions:
      - key: serving.noctaya.io/llmservice
        operator: Exists
