image:
  registry: ghcr.io/noctaya
  operator: noctaya
  gateway: noctaya-gateway
  tag: ""
  pullPolicy: IfNotPresent

operator:
  replicas: 1
  leaderElect: false
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi

gateway:
  # Multiple replicas use a per-LLMService demand aggregator for correct scaling.
  replicas: 1

serviceAccount:
  create: true
  name: ""

nameOverride: ""
