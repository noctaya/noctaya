image:
  registry: ghcr.io/noctaya
  operator: noctaya
  gateway: noctaya-gateway
  tag: ""
  pullPolicy: IfNotPresent

operator:
  replicas: 2
  leaderElect: true
  resources:
    limits:
      cpu: 500m
      memory: 256Mi
    requests:
      cpu: 10m
      memory: 128Mi

gateway:
  # Multiple replicas use a per-LLMService demand aggregator for correct scaling.
  replicas: 1

serviceAccount:
  create: true
  # Required when create is false; the chart never binds controller privileges
  # to the namespace's default ServiceAccount implicitly.
  name: ""

nameOverride: ""
