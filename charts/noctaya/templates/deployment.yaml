{{- if hasKey .Values.gateway "scalerMode" -}}
{{- fail "gateway.scalerMode has been removed; Noctaya always uses KEDA External Push" -}}
{{- end -}}
{{- if ne (int .Values.gateway.replicas) 1 -}}
{{- fail "gateway.replicas must be 1 until demand aggregation is available" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "noctaya.fullname" . }}-controller-manager
  namespace: {{ .Release.Namespace }}
  labels: {{- include "noctaya.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.operator.replicas }}
  selector:
    matchLabels: {{- include "noctaya.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels: {{- include "noctaya.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "noctaya.serviceAccountName" . }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: manager
          image: {{ include "noctaya.operatorImage" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --leader-elect={{ .Values.operator.leaderElect }}
            - --health-probe-bind-address=:8081
            - --metrics-bind-address=0
            - --gateway-image={{ include "noctaya.gatewayImage" . }}
            - --gateway-replicas={{ .Values.gateway.replicas }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 15
            periodSeconds: 20
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
            periodSeconds: 10
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources: {{- toYaml .Values.operator.resources | nindent 12 }}
      terminationGracePeriodSeconds: 10
